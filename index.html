<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fitness Memo</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6f7a8a;--line:#e2e7ef;--blue:#2367d1;--soft:#edf4ff;--green:#25835a;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:760px;margin:auto;padding:0 14px 105px}
header{margin:0 -14px 16px;padding:24px 20px 18px;background:linear-gradient(135deg,#fff,#eef4ff);border-bottom:1px solid var(--line)}
h1{font-size:1.4rem;margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 8px 24px rgba(31,48,74,.07)}
h2{font-size:1.05rem;margin:0 0 11px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2,.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{padding:11px;border:1px solid var(--line);border-radius:14px;background:#fbfcfe;text-align:center}
.metric span{display:block;color:var(--muted);font-size:.72rem}.metric b{display:block;font-size:1.1rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{border:1px solid var(--line);background:#fff;padding:11px;border-radius:12px;color:var(--muted);font-weight:800}
.seg button.active{background:var(--blue);color:#fff}
.meal,.history,.exercise{border:1px solid var(--line);border-radius:14px;background:#fbfcfe;padding:10px;margin-bottom:8px}
.meal{display:flex;justify-content:space-between;gap:8px}.meal small,.muted{color:var(--muted)}
.total{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-weight:800}
label{display:block;color:var(--muted);font-size:.74rem;margin:0 0 4px}
input,select{width:100%;padding:10px;border:1px solid #ccd5e1;border-radius:11px;background:#fff;font:inherit}
.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:800}
.btn.secondary{background:#edf1f6;color:var(--text)}.btn.danger{background:var(--red)}.btn.small{padding:7px 9px;font-size:.75rem}.btn.full{width:100%}
.btn:disabled{opacity:.45}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.head-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}
.set-row{display:grid;grid-template-columns:44px 1fr 1fr auto;gap:7px;align-items:end;margin-top:8px}
.set-no{align-self:center;text-align:center;font-weight:800;color:var(--muted)}
.compare{margin:8px 0;padding:8px 9px;border-radius:10px;background:var(--soft);font-size:.8rem;line-height:1.5}
.compare.good{background:#eaf7f0;color:var(--green);font-weight:700}
.exercise-name{font-weight:700}
.exercise-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
canvas{width:100%;height:220px;border:1px solid var(--line);border-radius:14px;background:#fbfcfe}
.empty{text-align:center;color:var(--muted);padding:14px}
.editor{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:#fbfcfe}
nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(740px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);padding:7px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(31,48,74,.15)}
nav button{border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:10px;font-size:.7rem;font-weight:700}nav button.active{background:var(--blue);color:#fff}
@media(max-width:560px){.grid4{grid-template-columns:1fr 1fr}.grid2,.row{grid-template-columns:1fr}.set-row{grid-template-columns:36px 1fr 1fr auto}}
</style>
</head>
<body>
<div class="app">
<header><h1>Fitness Memo</h1><p>体重・食事・ジム記録を、メモ感覚で。</p></header>

<section id="home" class="tab active">
  <div class="card"><h2>目標</h2><div class="grid4"><div class="metric"><span>カロリー</span><b>2,300</b><span>kcal</span></div><div class="metric"><span>P</span><b>110g</b></div><div class="metric"><span>F</span><b>50g</b></div><div class="metric"><span>C</span><b>330g</b></div></div></div>
  <div class="card"><h2>今日のトレーニング</h2><div class="seg" id="todayButtons"><button data-v="A">A</button><button data-v="B">B</button><button data-v="C">C</button><button data-v="休み">休み</button></div></div>
  <div class="card"><h2>今日の体重</h2><div id="homeWeight" class="metric"></div></div>
  <div class="card"><div class="grid2"><div><h2>朝食</h2><div id="homeBreakfast"></div><div id="homeBreakfastTotal" class="total"></div></div><div><h2>昼食</h2><div id="homeLunch"></div><div id="homeLunchTotal" class="total"></div></div></div><div id="homeFoodTotal" class="total"></div></div>
</section>

<section id="weight" class="tab">
  <div class="card"><h2>体重入力</h2><div class="row"><div><label>日付</label><input type="date" id="weightDate"></div><div><label>体重（kg）</label><input type="number" step="0.1" id="weightValue" placeholder="54.0"></div></div><button class="btn full" id="saveWeight">保存</button></div>
  <div class="card"><h2>推移</h2><canvas id="chart" width="700" height="220"></canvas></div>
  <div class="card"><h2>履歴</h2><div id="weightHistory"></div></div>
</section>

<section id="gym" class="tab">
  <div class="card">
    <div class="head"><h2>ジム記録</h2><div class="head-actions"><button class="btn secondary small" id="copyPreviousWorkout">前回内容をコピー</button><button class="btn secondary small" id="addExercise">種目追加</button></div></div>
    <div class="row"><div><label>メニュー</label><select id="pattern"><option>A</option><option>B</option><option>C</option></select></div><div><label>日付</label><input type="date" id="gymDate"></div></div>
    <div id="previousWorkoutSummary" class="compare"></div>
    <div id="exerciseList"></div>
    <button class="btn full" id="saveWorkout">保存</button>
  </div>
  <div class="card"><h2>最近の記録</h2><div id="workoutHistory"></div></div>
</section>

<section id="food" class="tab">
  <div class="card"><h2>朝食</h2><div id="breakfastView"></div><div id="breakfastTotal" class="total"></div></div>
  <div class="card"><h2>昼食</h2><div id="lunchView"></div><div id="lunchTotal" class="total"></div></div>
  <div class="card"><h2>朝＋昼</h2><div id="grandTotal" class="metric"></div></div>
</section>

<section id="settings" class="tab">
  <div class="card"><h2>食事設定</h2><h3>朝食</h3><div id="breakfastEditor"></div><button class="btn secondary small" data-add-food="breakfast">食品追加</button><h3>昼食</h3><div id="lunchEditor"></div><button class="btn secondary small" data-add-food="lunch">食品追加</button><button class="btn full" id="saveFoods" style="margin-top:12px">食事設定を保存</button></div>
  <div class="card"><button class="btn danger full" id="resetAll">全データを初期化</button></div>
</section>
</div>

<nav><button class="active" data-tab="home">ホーム</button><button data-tab="weight">体重</button><button data-tab="gym">ジム</button><button data-tab="food">食事</button><button data-tab="settings">設定</button></nav>

<script>
(()=>{"use strict";
const K="mikio_fitness_memo_v01";
const D={
  today:"休み",
  weights:[],
  workouts:[],
  foods:{
    breakfast:[
      {name:"オートミール",amount:"70g",kcal:259,p:9,f:6.4,c:48},
      {name:"牛乳",amount:"150ml",kcal:92,p:5,f:5.7,c:7.2},
      {name:"バナナ",amount:"1本",kcal:93,p:1.1,f:.2,c:22.5},
      {name:"きな粉",amount:"15g",kcal:68,p:5.5,f:3.9,c:4.3},
      {name:"はちみつ",amount:"10g",kcal:33,p:0,f:0,c:8.2},
      {name:"ホエイプロテイン",amount:"1杯",kcal:100,p:20,f:1.5,c:3}
    ],
    lunch:[
      {name:"白米",amount:"350g",kcal:546,p:8.8,f:1.1,c:129.9},
      {name:"鶏むね肉（皮なし）",amount:"200g",kcal:210,p:46.7,f:3.8,c:.2},
      {name:"ブロッコリー",amount:"50g",kcal:19,p:2.7,f:.3,c:3.3},
      {name:"オリーブオイル",amount:"4g",kcal:36,p:0,f:4,c:0}
    ]
  },
  exercises:{
    A:[{name:"チェストプレス",sets:3},{name:"ラットプルダウン",sets:3},{name:"レッグプレス",sets:3}],
    B:[{name:"インクラインチェストプレス",sets:3},{name:"シーテッドロー",sets:3},{name:"レッグカール",sets:3}],
    C:[]
  }
};

const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#039;"}[m]));
const fmt=(n,d=1)=>Number(n).toFixed(d).replace(/\.0$/,"");
const today=()=>{let d=new Date(),z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const positiveInt=(v,fallback=3)=>{const n=parseInt(v,10);return Number.isFinite(n)&&n>0?n:fallback};

function normalizeExerciseTemplate(e){
  return {name:e?.name||"新しい種目",sets:positiveInt(Array.isArray(e?.sets)?e.sets.length:e?.sets,3)};
}
function normalizeWorkoutExercise(e){
  if(Array.isArray(e?.sets)){
    return {name:e.name||"種目",sets:e.sets.map(x=>({kg:String(x?.kg??""),reps:String(x?.reps??"")}))};
  }
  const count=positiveInt(e?.sets,3);
  return {name:e?.name||"種目",sets:Array.from({length:count},()=>({kg:String(e?.kg??""),reps:String(e?.reps??"")}))};
}
function loadState(){
  let raw={};
  try{raw=JSON.parse(localStorage.getItem(K)||"{}")||{}}catch{}
  const out=clone(D);
  out.today=raw.today??out.today;
  out.weights=Array.isArray(raw.weights)?raw.weights:[];
  out.foods=raw.foods&&raw.foods.breakfast&&raw.foods.lunch?raw.foods:out.foods;
  out.exercises={A:[],B:[],C:[]};
  ["A","B","C"].forEach(p=>{
    const src=Array.isArray(raw.exercises?.[p])?raw.exercises[p]:D.exercises[p];
    out.exercises[p]=src.map(normalizeExerciseTemplate);
  });
  out.workouts=Array.isArray(raw.workouts)?raw.workouts.map(w=>({
    id:w.id??Date.now()+Math.random(),
    date:w.date||today(),
    pattern:["A","B","C"].includes(w.pattern)?w.pattern:"A",
    exercises:Array.isArray(w.exercises)?w.exercises.map(normalizeWorkoutExercise):[]
  })):[];
  return out;
}

let s=loadState();
const save=()=>localStorage.setItem(K,JSON.stringify(s));
const sum=a=>a.reduce((t,x)=>({kcal:t.kcal+(+x.kcal||0),p:t.p+(+x.p||0),f:t.f+(+x.f||0),c:t.c+(+x.c||0)}),{kcal:0,p:0,f:0,c:0});
const txt=t=>`${fmt(t.kcal,0)}kcal｜P${fmt(t.p)} F${fmt(t.f)} C${fmt(t.c)}`;
const meal=a=>a.map(x=>`<div class="meal"><div><b>${esc(x.name)}</b><br><small>${esc(x.amount)}</small></div><div style="text-align:right"><b>${fmt(x.kcal,0)}kcal</b><br><small>P${fmt(x.p)} F${fmt(x.f)} C${fmt(x.c)}</small></div></div>`).join("");

function renderHome(){
  document.querySelectorAll("#todayButtons button").forEach(b=>b.classList.toggle("active",b.dataset.v===s.today));
  let w=[...s.weights].sort((a,b)=>b.date.localeCompare(a.date))[0];
  homeWeight.innerHTML=w?`<span>${w.date}</span><b>${fmt(w.value)} kg</b>`:`<span>未記録</span><b>-- kg</b>`;
  homeBreakfast.innerHTML=meal(s.foods.breakfast);homeLunch.innerHTML=meal(s.foods.lunch);
  let b=sum(s.foods.breakfast),l=sum(s.foods.lunch),g=sum([...s.foods.breakfast,...s.foods.lunch]);
  homeBreakfastTotal.textContent=txt(b);homeLunchTotal.textContent=txt(l);homeFoodTotal.textContent="朝＋昼："+txt(g);
}
function renderFood(){
  breakfastView.innerHTML=meal(s.foods.breakfast);lunchView.innerHTML=meal(s.foods.lunch);
  let b=sum(s.foods.breakfast),l=sum(s.foods.lunch),g=sum([...s.foods.breakfast,...s.foods.lunch]);
  breakfastTotal.textContent=txt(b);lunchTotal.textContent=txt(l);grandTotal.innerHTML=`<span>合計</span><b>${txt(g)}</b>`;
}
function draw(){
  let c=chart,x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.fillStyle="#fbfcfe";x.fillRect(0,0,w,h);
  if(s.weights.length<2){x.fillStyle="#6f7a8a";x.font="16px sans-serif";x.textAlign="center";x.fillText("2件以上でグラフ表示",w/2,h/2);return}
  let a=[...s.weights].sort((a,b)=>a.date.localeCompare(b.date)).slice(-30),v=a.map(q=>q.value),mn=Math.min(...v)-.3,mx=Math.max(...v)+.3,p=35;
  x.strokeStyle="#e2e7ef";for(let i=0;i<5;i++){let y=p+(h-2*p)*i/4;x.beginPath();x.moveTo(p,y);x.lineTo(w-p,y);x.stroke()}
  x.strokeStyle="#2367d1";x.lineWidth=3;x.beginPath();a.forEach((q,i)=>{let px=p+(w-2*p)*i/(a.length-1),py=h-p-(h-2*p)*(q.value-mn)/(mx-mn||1);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
}
function renderWeight(){
  s.weights.sort((a,b)=>a.date.localeCompare(b.date));
  weightHistory.innerHTML=s.weights.length?[...s.weights].reverse().map(q=>`<div class="history"><div class="head"><div><b>${fmt(q.value)}kg</b><br><small>${q.date}</small></div><button class="btn danger small" data-del-weight="${q.date}">削除</button></div></div>`).join(""):`<div class="empty">まだ記録がありません</div>`;draw();
}

const drafts={};
function blankSet(){return {kg:"",reps:""}}
function blankExerciseFromTemplate(t){return {name:t.name,sets:Array.from({length:positiveInt(t.sets,3)},blankSet)};}
function ensureDraft(p){
  if(!drafts[p]) drafts[p]=s.exercises[p].map(blankExerciseFromTemplate);
  return drafts[p];
}
function previousWorkout(p){return [...s.workouts].reverse().find(w=>w.pattern===p)||null;}
function previousExercise(p,name){
  const w=[...s.workouts].reverse().find(w=>w.pattern===p&&w.exercises.some(e=>e.name===name));
  return w?{workout:w,exercise:w.exercises.find(e=>e.name===name)}:null;
}
function setText(set,i){return `${i+1}：${esc(set.kg||"-")}kg × ${esc(set.reps||"-")}回`;}
function workoutCompact(w){
  if(!w)return "前回記録なし";
  return `${w.date}｜${w.exercises.map(e=>`${esc(e.name)}［${e.sets.map((x,i)=>setText(x,i)).join(" / ")}］`).join("<br>")}`;
}
function syncTemplateFromDraft(p){
  s.exercises[p]=ensureDraft(p).map(e=>({name:e.name||"新しい種目",sets:Math.max(1,e.sets.length)}));
}
function renderGym(){
  const p=pattern.value;
  const draft=ensureDraft(p);
  const prev=previousWorkout(p);
  previousWorkoutSummary.innerHTML=prev?`<b>前回 ${esc(p)}</b><br>${workoutCompact(prev)}`:`<b>前回 ${esc(p)}</b><br>記録なし`;
  copyPreviousWorkout.disabled=!prev;

  exerciseList.innerHTML=draft.length?draft.map((e,i)=>{
    const prevEx=previousExercise(p,e.name);
    const prevText=prevEx?`${prevEx.workout.date}<br>${prevEx.exercise.sets.map((x,si)=>setText(x,si)).join(" / ")}`:"前回記録なし";
    const setsHtml=e.sets.map((set,si)=>`<div class="set-row"><div class="set-no">${si+1}</div><div><label>重量kg</label><input type="number" step="0.5" data-set-input="1" data-ei="${i}" data-si="${si}" data-k="kg" value="${esc(set.kg)}"></div><div><label>回数</label><input type="number" inputmode="numeric" data-set-input="1" data-ei="${i}" data-si="${si}" data-k="reps" value="${esc(set.reps)}"></div><button class="btn danger small" data-del-set="1" data-ei="${i}" data-si="${si}" ${e.sets.length<=1?"disabled":""}>削除</button></div>`).join("");
    return `<div class="exercise"><div class="head"><input class="exercise-name" data-name-input="1" data-ei="${i}" value="${esc(e.name)}"><button class="btn danger small" data-del-ex="${i}">種目削除</button></div><div class="compare">${prevText}</div>${setsHtml}<div class="exercise-actions"><button class="btn secondary small" data-copy-ex="${i}" ${prevEx?"":"disabled"}>前回をコピー</button><button class="btn secondary small" data-add-set="${i}">セット追加</button></div></div>`;
  }).join(""):`<div class="empty">種目がありません。「種目追加」から登録してください。</div>`;

  workoutHistory.innerHTML=s.workouts.length?[...s.workouts].reverse().slice(0,10).map(w=>`<div class="history"><div class="head"><div><b>${esc(w.date)}｜${esc(w.pattern)}</b><br><small>${w.exercises.map(e=>`${esc(e.name)}：${e.sets.map((x,i)=>setText(x,i)).join(" / ")}`).join("<br>")}</small></div><button class="btn danger small" data-del-workout="${w.id}">削除</button></div></div>`).join(""):`<div class="empty">まだ記録がありません</div>`;
}

function renderEditors(){
  ["breakfast","lunch"].forEach(t=>document.getElementById(t+"Editor").innerHTML=s.foods[t].map((x,i)=>`<div class="editor"><div class="row"><div><label>食品名</label><input data-ft="${t}" data-i="${i}" data-k="name" value="${esc(x.name)}"></div><div><label>量</label><input data-ft="${t}" data-i="${i}" data-k="amount" value="${esc(x.amount)}"></div></div><div class="row"><div><label>kcal</label><input type="number" data-ft="${t}" data-i="${i}" data-k="kcal" value="${x.kcal}"></div><div><label>P / F / C</label><div class="sets"><input type="number" step=".1" data-ft="${t}" data-i="${i}" data-k="p" value="${x.p}"><input type="number" step=".1" data-ft="${t}" data-i="${i}" data-k="f" value="${x.f}"><input type="number" step=".1" data-ft="${t}" data-i="${i}" data-k="c" value="${x.c}"></div></div></div><button class="btn danger small" data-del-food="${t}" data-i="${i}">削除</button></div>`).join(""));
}
function renderAll(){renderHome();renderFood();renderWeight();renderGym();renderEditors()}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active");if(b.dataset.tab==="weight")draw();if(b.dataset.tab==="gym")renderGym()});

todayButtons.onclick=e=>{if(e.target.dataset.v){s.today=e.target.dataset.v;save();renderHome()}};
saveWeight.onclick=()=>{let d=weightDate.value,v=parseFloat(weightValue.value);if(!d||!Number.isFinite(v))return alert("日付と体重を入力してください");let o=s.weights.find(x=>x.date===d);o?o.value=v:s.weights.push({date:d,value:v});save();renderWeight();renderHome();weightValue.value=""};

pattern.onchange=renderGym;
addExercise.onclick=()=>{const p=pattern.value;ensureDraft(p).push({name:"新しい種目",sets:[blankSet(),blankSet(),blankSet()]});syncTemplateFromDraft(p);save();renderGym()};
copyPreviousWorkout.onclick=()=>{const p=pattern.value,prev=previousWorkout(p);if(!prev)return;drafts[p]=clone(prev.exercises);syncTemplateFromDraft(p);save();renderGym()};

exerciseList.oninput=e=>{
  const p=pattern.value,d=ensureDraft(p);
  if(e.target.dataset.nameInput){const i=+e.target.dataset.ei;d[i].name=e.target.value;syncTemplateFromDraft(p);save();}
  if(e.target.dataset.setInput){const ei=+e.target.dataset.ei,si=+e.target.dataset.si,k=e.target.dataset.k;d[ei].sets[si][k]=e.target.value;}
};
exerciseList.onchange=e=>{if(e.target.dataset.nameInput)renderGym()};

saveWorkout.onclick=()=>{
  const p=pattern.value,d=gymDate.value,draft=ensureDraft(p);
  if(!d)return alert("日付を入力してください");
  const hasAny=draft.some(e=>e.sets.some(set=>set.kg!==""||set.reps!==""));
  if(!hasAny)return alert("重量か回数を入力してください");
  const cleaned=draft.map(e=>({name:(e.name||"種目").trim(),sets:e.sets.map(set=>({kg:String(set.kg??""),reps:String(set.reps??"")}))}));
  s.workouts.push({id:Date.now(),date:d,pattern:p,exercises:cleaned});
  syncTemplateFromDraft(p);save();
  drafts[p]=s.exercises[p].map(blankExerciseFromTemplate);
  renderGym();alert("保存しました");
};

saveFoods.onclick=()=>{document.querySelectorAll("[data-ft]").forEach(i=>{let t=i.dataset.ft,n=+i.dataset.i,k=i.dataset.k;s.foods[t][n][k]=["kcal","p","f","c"].includes(k)?(+i.value||0):i.value});save();renderAll();alert("保存しました")};

document.onclick=e=>{
  if(e.target.dataset.delWeight){s.weights=s.weights.filter(x=>x.date!==e.target.dataset.delWeight);save();renderWeight();renderHome()}
  if(e.target.dataset.delEx!==undefined){const p=pattern.value,i=+e.target.dataset.delEx;ensureDraft(p).splice(i,1);syncTemplateFromDraft(p);save();renderGym()}
  if(e.target.dataset.addSet!==undefined){const p=pattern.value,i=+e.target.dataset.addSet;ensureDraft(p)[i].sets.push(blankSet());syncTemplateFromDraft(p);save();renderGym()}
  if(e.target.dataset.delSet){const p=pattern.value,ei=+e.target.dataset.ei,si=+e.target.dataset.si,ex=ensureDraft(p)[ei];if(ex.sets.length>1){ex.sets.splice(si,1);syncTemplateFromDraft(p);save();renderGym()}}
  if(e.target.dataset.copyEx!==undefined){const p=pattern.value,i=+e.target.dataset.copyEx,d=ensureDraft(p),prevEx=previousExercise(p,d[i].name);if(prevEx){d[i].sets=clone(prevEx.exercise.sets);syncTemplateFromDraft(p);save();renderGym()}}
  if(e.target.dataset.delWorkout){s.workouts=s.workouts.filter(x=>String(x.id)!==String(e.target.dataset.delWorkout));save();renderGym()}
  if(e.target.dataset.addFood){s.foods[e.target.dataset.addFood].push({name:"新しい食品",amount:"",kcal:0,p:0,f:0,c:0});renderEditors()}
  if(e.target.dataset.delFood){s.foods[e.target.dataset.delFood].splice(+e.target.dataset.i,1);renderEditors()}
};

resetAll.onclick=()=>{if(confirm("全データを削除しますか？")){localStorage.removeItem(K);s=loadState();Object.keys(drafts).forEach(k=>delete drafts[k]);save();renderAll()}};

weightDate.value=today();gymDate.value=today();renderAll();
})();
</script>
</body>
