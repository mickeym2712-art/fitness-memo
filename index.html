<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fitness Memo</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6f7a8a;--line:#e2e7ef;--blue:#2367d1;--soft:#edf4ff;--green:#25835a;--red:#c0392b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:760px;margin:auto;padding:0 14px 105px}header{margin:0 -14px 16px;padding:24px 20px 18px;background:linear-gradient(135deg,#fff,#eef4ff);border-bottom:1px solid var(--line)}h1{font-size:1.4rem;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:.86rem}.tab{display:none}.tab.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 8px 24px rgba(31,48,74,.07)}h2{font-size:1.05rem;margin:0 0 11px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid2,.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:11px;border:1px solid var(--line);border-radius:14px;background:#fbfcfe;text-align:center}.metric span{display:block;color:var(--muted);font-size:.72rem}.metric b{display:block;font-size:1.1rem}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg button{border:1px solid var(--line);background:#fff;padding:11px;border-radius:12px;color:var(--muted);font-weight:800}.seg button.active{background:var(--blue);color:#fff}.meal,.history,.exercise{border:1px solid var(--line);border-radius:14px;background:#fbfcfe;padding:10px;margin-bottom:8px}.meal{display:flex;justify-content:space-between;gap:8px}.meal small,.muted{color:var(--muted)}.total{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-weight:800}label{display:block;color:var(--muted);font-size:.74rem;margin:0 0 4px}input,select{width:100%;padding:10px;border:1px solid #ccd5e1;border-radius:11px;background:#fff;font:inherit}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:800}.btn.secondary{background:#edf1f6;color:var(--text)}.btn.danger{background:var(--red)}.btn.small{padding:7px 9px;font-size:.75rem}.btn.full{width:100%}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.sets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.compare{margin:8px 0;padding:8px 9px;border-radius:10px;background:var(--soft);font-size:.8rem}.compare.good{background:#eaf7f0;color:var(--green);font-weight:700}canvas{width:100%;height:220px;border:1px solid var(--line);border-radius:14px;background:#fbfcfe}.empty{text-align:center;color:var(--muted);padding:14px}.editor{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:#fbfcfe}nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(740px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);padding:7px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(31,48,74,.15)}nav button{border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:10px;font-size:.7rem;font-weight:700}nav button.active{background:var(--blue);color:#fff}@media(max-width:560px){.grid4{grid-template-columns:1fr 1fr}.grid2,.row{grid-template-columns:1fr}}
</style></head><body><div class="app"><header><h1>Fitness Memo</h1><p>体重・食事・ジム記録を、メモ感覚で。</p></header>
<section id="home" class="tab active"><div class="card"><h2>目標</h2><div class="grid4"><div class="metric"><span>カロリー</span><b>2,300</b><span>kcal</span></div><div class="metric"><span>P</span><b>110g</b></div><div class="metric"><span>F</span><b>50g</b></div><div class="metric"><span>C</span><b>330g</b></div></div></div><div class="card"><h2>今日のトレーニング</h2><div class="seg" id="todayButtons"><button data-v="A">A</button><button data-v="B">B</button><button data-v="休み">休み</button></div></div><div class="card"><h2>今日の体重</h2><div id="homeWeight" class="metric"></div></div><div class="card"><div class="grid2"><div><h2>朝食</h2><div id="homeBreakfast"></div><div id="homeBreakfastTotal" class="total"></div></div><div><h2>昼食</h2><div id="homeLunch"></div><div id="homeLunchTotal" class="total"></div></div></div><div id="homeFoodTotal" class="total"></div></div></section>
<section id="weight" class="tab"><div class="card"><h2>体重入力</h2><div class="row"><div><label>日付</label><input type="date" id="weightDate"></div><div><label>体重（kg）</label><input type="number" step="0.1" id="weightValue" placeholder="54.0"></div></div><button class="btn full" id="saveWeight">保存</button></div><div class="card"><h2>推移</h2><canvas id="chart" width="700" height="220"></canvas></div><div class="card"><h2>履歴</h2><div id="weightHistory"></div></div></section>
<section id="gym" class="tab"><div class="card"><div class="head"><h2>ジム記録</h2><button class="btn secondary small" id="addExercise">種目追加</button></div><div class="row"><div><label>メニュー</label><select id="pattern"><option>A</option><option>B</option></select></div><div><label>日付</label><input type="date" id="gymDate"></div></div><div id="exerciseList"></div><button class="btn full" id="saveWorkout">保存</button></div><div class="card"><h2>最近の記録</h2><div id="workoutHistory"></div></div></section>
<section id="food" class="tab"><div class="card"><h2>朝食</h2><div id="breakfastView"></div><div id="breakfastTotal" class="total"></div></div><div class="card"><h2>昼食</h2><div id="lunchView"></div><div id="lunchTotal" class="total"></div></div><div class="card"><h2>朝＋昼</h2><div id="grandTotal" class="metric"></div></div></section>
<section id="settings" class="tab"><div class="card"><h2>食事設定</h2><h3>朝食</h3><div id="breakfastEditor"></div><button class="btn secondary small" data-add-food="breakfast">食品追加</button><h3>昼食</h3><div id="lunchEditor"></div><button class="btn secondary small" data-add-food="lunch">食品追加</button><button class="btn full" id="saveFoods" style="margin-top:12px">食事設定を保存</button></div><div class="card"><button class="btn danger full" id="resetAll">全データを初期化</button></div></section></div>
<nav><button class="active" data-tab="home">ホーム</button><button data-tab="weight">体重</button><button data-tab="gym">ジム</button><button data-tab="food">食事</button><button data-tab="settings">設定</button></nav>
<script>
(()=>{"use strict";const K="mikio_fitness_memo_v01",D={today:"休み",weights:[],workouts:[],foods:{breakfast:[{name:"オートミール",amount:"70g",kcal:259,p:9,f:6.4,c:48},{name:"牛乳",amount:"150ml",kcal:92,p:5,f:5.7,c:7.2},{name:"バナナ",amount:"1本",kcal:93,p:1.1,f:.2,c:22.5},{name:"きな粉",amount:"15g",kcal:68,p:5.5,f:3.9,c:4.3},{name:"はちみつ",amount:"10g",kcal:33,p:0,f:0,c:8.2},{name:"ホエイプロテイン",amount:"1杯",kcal:100,p:20,f:1.5,c:3}],lunch:[{name:"白米",amount:"350g",kcal:546,p:8.8,f:1.1,c:129.9},{name:"鶏むね肉（皮なし）",amount:"200g",kcal:210,p:46.7,f:3.8,c:.2},{name:"ブロッコリー",amount:"50g",kcal:19,p:2.7,f:.3,c:3.3},{name:"オリーブオイル",amount:"4g",kcal:36,p:0,f:4,c:0}]},exercises:{A:[{name:"チェストプレス",kg:"",reps:"",sets:"3"},{name:"ラットプルダウン",kg:"",reps:"",sets:"3"},{name:"レッグプレス",kg:"",reps:"",sets:"3"}],B:[{name:"インクラインチェストプレス",kg:"",reps:"",sets:"3"},{name:"シーテッドロー",kg:"",reps:"",sets:"3"},{name:"レッグカール",kg:"",reps:"",sets:"3"}]}};const clone=x=>JSON.parse(JSON.stringify(x));let s=(()=>{try{return Object.assign(clone(D),JSON.parse(localStorage.getItem(K)||"{}"))}catch{return clone(D)}})();const save=()=>localStorage.setItem(K,JSON.stringify(s)),esc=x=>String(x??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#039;"}[m])),fmt=(n,d=1)=>Number(n).toFixed(d).replace(/\.0$/,"");const today=()=>{let d=new Date(),z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const sum=a=>a.reduce((t,x)=>({kcal:t.kcal+(+x.kcal||0),p:t.p+(+x.p||0),f:t.f+(+x.f||0),c:t.c+(+x.c||0)}),{kcal:0,p:0,f:0,c:0}),txt=t=>`${fmt(t.kcal,0)}kcal｜P${fmt(t.p)} F${fmt(t.f)} C${fmt(t.c)}`,meal=a=>a.map(x=>`<div class="meal"><div><b>${esc(x.name)}</b><br><small>${esc(x.amount)}</small></div><div style="text-align:right"><b>${fmt(x.kcal,0)}kcal</b><br><small>P${fmt(x.p)} F${fmt(x.f)} C${fmt(x.c)}</small></div></div>`).join("");
function renderHome(){document.querySelectorAll("#todayButtons button").forEach(b=>b.classList.toggle("active",b.dataset.v===s.today));let w=[...s.weights].sort((a,b)=>b.date.localeCompare(a.date))[0];homeWeight.innerHTML=w?`<span>${w.date}</span><b>${fmt(w.value)} kg</b>`:`<span>未記録</span><b>-- kg</b>`;homeBreakfast.innerHTML=meal(s.foods.breakfast);homeLunch.innerHTML=meal(s.foods.lunch);let b=sum(s.foods.breakfast),l=sum(s.foods.lunch),g=sum([...s.foods.breakfast,...s.foods.lunch]);homeBreakfastTotal.textContent=txt(b);homeLunchTotal.textContent=txt(l);homeFoodTotal.textContent="朝＋昼："+txt(g)}
function renderFood(){breakfastView.innerHTML=meal(s.foods.breakfast);lunchView.innerHTML=meal(s.foods.lunch);let b=sum(s.foods.breakfast),l=sum(s.foods.lunch),g=sum([...s.foods.breakfast,...s.foods.lunch]);breakfastTotal.textContent=txt(b);lunchTotal.textContent=txt(l);grandTotal.innerHTML=`<span>合計</span><b>${txt(g)}</b>`}
function draw(){let c=chart,x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.fillStyle="#fbfcfe";x.fillRect(0,0,w,h);if(s.weights.length<2){x.fillStyle="#6f7a8a";x.font="16px sans-serif";x.textAlign="center";x.fillText("2件以上でグラフ表示",w/2,h/2);return}let a=s.weights.slice(-30),v=a.map(q=>q.value),mn=Math.min(...v)-.3,mx=Math.max(...v)+.3,p=35;x.strokeStyle="#e2e7ef";for(let i=0;i<5;i++){let y=p+(h-2*p)*i/4;x.beginPath();x.moveTo(p,y);x.lineTo(w-p,y);x.stroke()}x.strokeStyle="#2367d1";x.lineWidth=3;x.beginPath();a.forEach((q,i)=>{let px=p+(w-2*p)*i/(a.length-1),py=h-p-(h-2*p)*(q.value-mn)/(mx-mn||1);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
function renderWeight(){s.weights.sort((a,b)=>a.date.localeCompare(b.date));weightHistory.innerHTML=s.weights.length?[...s.weights].reverse().map(q=>`<div class="history"><div class="head"><div><b>${fmt(q.value)}kg</b><br><small>${q.date}</small></div><button class="btn danger small" data-del-weight="${q.date}">削除</button></div></div>`).join(""):`<div class="empty">まだ記録がありません</div>`;draw()}
const last=(p,n)=>{let w=[...s.workouts].reverse().find(w=>w.pattern===p&&w.exercises.some(e=>e.name===n));return w?w.exercises.find(e=>e.name===n):null};function renderGym(){let p=pattern.value;exerciseList.innerHTML=s.exercises[p].map((e,i)=>{let l=last(p,e.name),d=l&&+e.kg>+l.kg?`前回比 +${fmt(+e.kg-+l.kg)}kg`:l&&+e.kg===+l.kg&&+e.reps>+l.reps?`前回比 +${fmt(+e.reps-+l.reps,0)}回`:l?`前回：${esc(l.kg||"-")}kg × ${esc(l.reps||"-")}回 × ${esc(l.sets||"-")}セット`:"前回記録なし";return `<div class="exercise"><div class="head"><input data-name="${i}" value="${esc(e.name)}"><button class="btn danger small" data-del-ex="${i}">削除</button></div><div class="compare ${d.includes("+")?"good":""}">${d}</div><div class="sets"><div><label>重量kg</label><input type="number" step="0.5" data-i="${i}" data-k="kg" value="${esc(e.kg)}"></div><div><label>回数</label><input type="number" data-i="${i}" data-k="reps" value="${esc(e.reps)}"></div><div><label>セット</label><input type="number" data-i="${i}" data-k="sets" value="${esc(e.sets)}"></div></div></div>`}).join("");workoutHistory.innerHTML=s.workouts.length?[...s.workouts].reverse().slice(0,10).map(w=>`<div class="history"><div class="head"><div><b>${w.date}｜${w.pattern}</b><br><small>${w.exercises.map(e=>`${esc(e.name)}：${esc(e.kg||"-")}kg×${esc(e.reps||"-")}回×${esc(e.sets||"-")}`).join("<br>")}</small></div><button class="btn danger small" data-del-workout="${w.id}">削除</button></div></div>`).join(""):`<div class="empty">まだ記録がありません</div>`}
function renderEditors(){["breakfast","lunch"].forEach(t=>document.getElementById(t+"Editor").innerHTML=s.foods[t].map((x,i)=>`<div class="editor"><div class="row"><div><label>食品名</label><input data-ft="${t}" data-i="${i}" data-k="name" value="${esc(x.name)}"></div><div><label>量</label><input data-ft="${t}" data-i="${i}" data-k="amount" value="${esc(x.amount)}"></div></div><div class="row"><div><label>kcal</label><input type="number" data-ft="${t}" data-i="${i}" data-k="kcal" value="${x.kcal}"></div><div><label>P / F / C</label><div class="sets"><input type="number" step=".1" data-ft="${t}" data-i="${i}" data-k="p" value="${x.p}"><input type="number" step=".1" data-ft="${t}" data-i="${i}" data-k="f" value="${x.f}"><input type="number" step=".1" data-ft="${t}" data-i="${i}" data-k="c" value="${x.c}"></div></div></div><button class="btn danger small" data-del-food="${t}" data-i="${i}">削除</button></div>`).join(""))}
function renderAll(){renderHome();renderFood();renderWeight();renderGym();renderEditors()}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active");if(b.dataset.tab==="weight")draw()});todayButtons.onclick=e=>{if(e.target.dataset.v){s.today=e.target.dataset.v;save();renderHome()}};saveWeight.onclick=()=>{let d=weightDate.value,v=parseFloat(weightValue.value);if(!d||!Number.isFinite(v))return alert("日付と体重を入力してください");let o=s.weights.find(x=>x.date===d);o?o.value=v:s.weights.push({date:d,value:v});save();renderWeight();renderHome();weightValue.value=""};pattern.onchange=renderGym;addExercise.onclick=()=>{s.exercises[pattern.value].push({name:"新しい種目",kg:"",reps:"",sets:"3"});renderGym()};exerciseList.oninput=e=>{let p=pattern.value,i=+e.target.dataset.i;if(e.target.dataset.name!==undefined)s.exercises[p][+e.target.dataset.name].name=e.target.value;if(e.target.dataset.k)s.exercises[p][i][e.target.dataset.k]=e.target.value};saveWorkout.onclick=()=>{let p=pattern.value,d=gymDate.value;if(!s.exercises[p].some(e=>e.kg||e.reps))return alert("重量か回数を入力してください");s.workouts.push({id:Date.now(),date:d,pattern:p,exercises:clone(s.exercises[p])});s.exercises[p].forEach(e=>{e.kg="";e.reps=""});save();renderGym();alert("保存しました")};saveFoods.onclick=()=>{document.querySelectorAll("[data-ft]").forEach(i=>{let t=i.dataset.ft,n=+i.dataset.i,k=i.dataset.k;s.foods[t][n][k]=["kcal","p","f","c"].includes(k)?(+i.value||0):i.value});save();renderAll();alert("保存しました")};document.onclick=e=>{if(e.target.dataset.delWeight){s.weights=s.weights.filter(x=>x.date!==e.target.dataset.delWeight);save();renderWeight();renderHome()}if(e.target.dataset.delEx!==undefined){s.exercises[pattern.value].splice(+e.target.dataset.delEx,1);renderGym()}if(e.target.dataset.delWorkout){s.workouts=s.workouts.filter(x=>String(x.id)!==String(e.target.dataset.delWorkout));save();renderGym()}if(e.target.dataset.addFood){s.foods[e.target.dataset.addFood].push({name:"新しい食品",amount:"",kcal:0,p:0,f:0,c:0});renderEditors()}if(e.target.dataset.delFood){s.foods[e.target.dataset.delFood].splice(+e.target.dataset.i,1);renderEditors()}};resetAll.onclick=()=>{if(confirm("全データを削除しますか？")){s=clone(D);save();renderAll()}};weightDate.value=today();gymDate.value=today();renderAll()})();
</script></body></html>
